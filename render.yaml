# Always-on deposit watcher. Shares the database and tick lease with the web app.
# Secrets (sync: false) are entered in the Render dashboard.
services:
  - type: web
    name: naust-watcher
    runtime: node
    plan: free
    region: virginia
    rootDir: web
    buildCommand: npm ci
    startCommand: npm run watch
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NAUST_POOL
        value: Ada,Ben,Tokunbo
      - key: NAUST_POLL_MS
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: KEYCLOAK_TOKEN_URL
        sync: false
      - key: KEYCLOAK_CLIENT_ID
        sync: false
      - key: HACKCANTON_USERNAME
        sync: false
      - key: HACKCANTON_PASSWORD
        sync: false
      - key: JSON_API
        sync: false
      - key: VALIDATOR_API
        sync: false
