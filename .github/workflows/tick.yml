# Backstop trigger: runs one deposit tick every 5 minutes (GitHub schedules are best-effort).
# Requires the repository secret CRON_SECRET, matching the Vercel project's value.
name: Deposit tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://naust.namite.xyz/api/tick
