# Runs one deposit tick on the live site every 5 minutes, so a deposit sent while nobody has the demo open is
# still credited and swept. GitHub runs schedules on a best-effort basis; gaps of 10 to 15 minutes are normal.
# Needs the repository secret CRON_SECRET, the same value as the Vercel project's CRON_SECRET.
name: Deposit tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://naust.namite.xyz/api/tick
